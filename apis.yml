name: Tammwel
description: Tammwel (Tamawal) is a Saudi Arabian digital financing intermediary that connects consumers with
  licensed financial institutions to compare and obtain Sharia-compliant financing. Its consumer platform and
  iOS/Android apps let users apply once and receive multiple offers across four products - personal loans,
  credit cards, auto financing, and mortgage financing (each up to 150,000 SAR) - emphasizing transparent
  pricing with no hidden fees. The company is a portfolio company of 500 Global. As of this enrichment pass
  Tammwel publishes no public API, developer portal, documentation, SDK, or /.well-known discovery surface;
  this profile captures its identity and infrastructure security posture.
